migration_status:

  MIGRATE:
    description: "Tabla física confirmada como parte del consumo efectivo."

  VALIDATE_SQL:
    description: "Dependencia física indirecta que requiere validar el SQL real."

  AUXILIARY:
    description: "Dependencia técnica o auxiliar."

  NOT_PHYSICAL:
    description: "Objeto de metadata que no representa una tabla física."

  TERMINAL_COLUMN:
    description: "Columna utilizada únicamente como validación técnica."
