name: MicroStrategy Lineage Bot

on:
  workflow_dispatch:
    inputs:
      object_query:
        description: "Nombre exacto o GUID del objeto MicroStrategy"
        required: true
        type: string

jobs:
  lineage:
    name: Ejecutar análisis de lineage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar MicroStrategy Lineage Bot
        env:
          OBJECT_QUERY: ${{ inputs.object_query }}
          DATASET_PATH: "data/Analisis de objetos_Operaciones.csv"
        run: |
          python -m src.microstrategy_lineage.cli \
            --data "$DATASET_PATH" \
            --object "$OBJECT_QUERY"
